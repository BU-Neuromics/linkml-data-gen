[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkml-data-gen"
version = "0.1.0"
description = "Generate realistic, stochastic, schema-valid test data from any LinkML schema."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BU Neuromics" }]
keywords = ["linkml", "test-data", "synthetic-data", "fixtures", "schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "faker>=24",
    "rstr>=3.2",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/BU-Neuromics/linkml-data-gen"
Repository = "https://github.com/BU-Neuromics/linkml-data-gen"
Documentation = "https://github.com/BU-Neuromics/linkml-data-gen/blob/main/docs/index.md"
Issues = "https://github.com/BU-Neuromics/linkml-data-gen/issues"
Changelog = "https://github.com/BU-Neuromics/linkml-data-gen/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
linkml-data-gen = "linkml_data_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
